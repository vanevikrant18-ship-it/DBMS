<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; color: #333; }

        .navbar {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .navbar h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255,255,255,0.25);
            font-size: 14px;
            transition: background 0.3s;
        }
        .navbar a:hover { background: rgba(255,255,255,0.35); }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.07);
            margin-bottom: 25px;
            border: 1px solid #eef0f5;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f4f6fb;
        }

        .card-header .icon-box {
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-header .icon-box svg { stroke: white; }

        .card-header h2 {
            font-size: 17px;
            font-weight: 700;
            margin: 0;
        }

        /* Old h2 support for pages not using card-header */
        .card h2 {
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0 15px;
            border: 1.5px solid #e0e4ef;
            border-radius: 7px;
            font-size: 14px;
            background: #f9faff;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            background: #fff;
        }

        textarea { resize: vertical; min-height: 80px; }

        label {
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
        }

        button {
            color: white;
            border: none;
            padding: 11px 28px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: opacity 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .error {
            background: #fce4e4;
            color: #c0392b;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success {
            background: #e4f9e4;
            color: #27ae60;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .interview-card {
            border-left: 4px solid;
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 0 6px 6px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        /* ✅ NO background color on th here
           Each dashboard sets its own thead color */
        th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
            color: white;
        }

        th:first-child { border-radius: 7px 0 0 0; }
        th:last-child  { border-radius: 0 7px 0 0; }

        td {
            padding: 11px 14px;
            border-bottom: 1px solid #eee;
        }

        tr:last-child td { border-bottom: none; }

        .empty-msg {
            font-size: 14px;
            padding: 10px 0;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #aaa;
        }

        .link { text-decoration: none; }
        .link:hover { text-decoration: underline; }

        .center { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    {% block navbar %}{% endblock %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

{% extends "main/base.html" %}

{% block content %}

<style>
    body {
        background: #ffffff;
        font-family: 'Segoe UI', sans-serif;
    }

    .login-wrapper {
        max-width: 420px;
        margin: 60px auto;
    }

    .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 36px 32px;
        box-shadow: 0 4px 24px rgba(180,60,0,0.10);
        border: 1px solid #fde8d8;
    }

    .login-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
    }

    .login-logo .logo-box {
        background: linear-gradient(135deg, #b83200, #e64a00);
        border-radius: 14px;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(184,50,0,0.3);
    }

    .login-logo .logo-box svg {
        stroke: white;
    }

    .login-title {
        text-align: center;
        font-size: 20px;
        font-weight: 800;
        color: #b83200;
        margin-bottom: 4px;
        letter-spacing: 0.3px;
    }

    .login-subtitle {
        text-align: center;
        color: #c07050;
        font-size: 13px;
        margin-bottom: 24px;
    }

    .error {
        background: #fff0eb;
        color: #b83200;
        padding: 10px 14px;
        border-radius: 7px;
        margin-bottom: 16px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-left: 4px solid #e64a00;
    }

    label {
        font-weight: 600;
        font-size: 13px;
        color: #b83200;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
        margin-top: 4px;
    }

    input {
        width: 100%;
        padding: 10px 14px;
        margin-bottom: 16px;
        border: 1.5px solid #fcd3bb;
        border-radius: 7px;
        font-size: 14px;
        color: #2a0e00;
        background: #fff8f4;
        transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus {
        outline: none;
        border-color: #e64a00;
        box-shadow: 0 0 0 3px rgba(230,74,0,0.1);
        background: #fff;
    }

    button {
        width: 100%;
        background: linear-gradient(135deg, #b83200, #e64a00);
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3px;
        transition: opacity 0.3s, transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 4px;
    }

    button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 0;
    }

    .divider hr {
        flex: 1;
        border: none;
        border-top: 1px solid #fcd3bb;
    }

    .divider span {
        font-size: 12px;
        color: #d0856a;
    }

    .center {
        text-align: center;
        font-size: 13px;
        color: #a06050;
        margin-top: 16px;
    }

    .center a {
        color: #e64a00;
        font-weight: 700;
        text-decoration: none;
    }

    .center a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-wrapper">
    <div class="card">

        <!-- Logo Icon -->
        <div class="login-logo">
            <div class="logo-box">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
        </div>

        <h2 class="login-title">Placement Portal</h2>
        <p class="login-subtitle">Login to your account</p>

        {% if error %}
        <div class="error">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Username
            </label>
            <input name="username" placeholder="Enter your username" required>

            <label>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Password
            </label>
            <input name="password" type="password" placeholder="Enter your password" required>

            <button type="submit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                Login
            </button>
        </form>

        <div class="divider">
            <hr/>
            <span>OR</span>
            <hr/>
        </div>

        <p class="center">
            Don't have an account?
            <a href="/register/">Register here</a>
        </p>

    </div>
</div>

{% endblock %}

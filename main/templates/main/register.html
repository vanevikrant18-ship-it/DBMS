{% extends "main/base.html" %}

{% block content %}

<style>
    body {
        background: #ffffff;
        font-family: 'Segoe UI', sans-serif;
    }

    .register-wrapper {
        max-width: 500px;
        margin: 40px auto;
    }

    .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 36px 32px;
        box-shadow: 0 4px 24px rgba(2,100,148,0.10);
        border: 1px solid #d6eef8;
    }

    .register-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
    }

    .register-logo .logo-box {
        background: linear-gradient(135deg, #026494, #0288d1);
        border-radius: 14px;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(2,100,148,0.3);
    }

    .register-logo .logo-box svg {
        stroke: white;
    }

    .register-title {
        text-align: center;
        font-size: 20px;
        font-weight: 800;
        color: #026494;
        margin-bottom: 4px;
        letter-spacing: 0.3px;
    }

    .register-subtitle {
        text-align: center;
        color: #4a90b0;
        font-size: 13px;
        margin-bottom: 24px;
    }

    .error {
        background: #e8f4fb;
        color: #026494;
        padding: 10px 14px;
        border-radius: 7px;
        margin-bottom: 16px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-left: 4px solid #0288d1;
    }

    label {
        font-weight: 600;
        font-size: 13px;
        color: #026494;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
        margin-top: 4px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px 14px;
        margin-bottom: 16px;
        border: 1.5px solid #b8dff0;
        border-radius: 7px;
        font-size: 14px;
        color: #00253a;
        background: #f2faff;
        transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #0288d1;
        box-shadow: 0 0 0 3px rgba(2,136,209,0.1);
        background: #fff;
    }

    textarea {
        resize: vertical;
        min-height: 85px;
    }

    /* Student Fields Section */
    #studentFields {
        background: #f0f9ff;
        border: 1px solid #c8e8f8;
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 16px;
    }

    /* Company Fields Section */
    #companyFields {
        background: #f0f9ff;
        border: 1px solid #c8e8f8;
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 16px;
    }

    .section-label {
        font-size: 13px;
        font-weight: 700;
        color: #0288d1;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #c8e8f8;
    }

    button {
        width: 100%;
        background: linear-gradient(135deg, #026494, #0288d1);
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3px;
        transition: opacity 0.3s, transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 4px;
    }

    button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 0;
    }

    .divider hr {
        flex: 1;
        border: none;
        border-top: 1px solid #b8dff0;
    }

    .divider span {
        font-size: 12px;
        color: #5aadd0;
    }

    .center {
        text-align: center;
        font-size: 13px;
        color: #5a90a8;
        margin-top: 16px;
    }

    .center a {
        color: #0288d1;
        font-weight: 700;
        text-decoration: none;
    }

    .center a:hover {
        text-decoration: underline;
    }
</style>

<div class="register-wrapper">
    <div class="card">

        <!-- Logo Icon -->
        <div class="register-logo">
            <div class="logo-box">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <line x1="19" y1="8" x2="19" y2="14"/>
                    <line x1="22" y1="11" x2="16" y2="11"/>
                </svg>
            </div>
        </div>

        <h2 class="register-title">Create Account</h2>
        <p class="register-subtitle">Fill in the details to register</p>

        {% if error %}
        <div class="error">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" id="registerForm">
            {% csrf_token %}

            <label>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Select Role
            </label>
            <select name="role" id="roleSelect" onchange="showFields()">
                <option value="">-- Select Role --</option>
                <option value="student">Student</option>
                <option value="company">Company</option>
                <option value="admin">Admin</option>
            </select>

            <label>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Username
            </label>
            <input name="username" placeholder="Enter username" required>

            <label>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Password
            </label>
            <input name="password" type="password" placeholder="Enter password" required>

            <!-- Student Fields -->
            <div id="studentFields" style="display:none;">
                <div class="section-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                    Student Details
                </div>

                <label>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Full Name
                </label>
                <input name="name" placeholder="Your full name">

                <label>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    Age
                </label>
                <input name="age" type="number" placeholder="Your age">

                <label>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                    Qualification
                </label>
                <input name="qualification" placeholder="e.g. B.Tech, BCA">

                <label>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6"/>
                        <polyline points="8 6 2 12 8 18"/>
                    </svg>
                    Skills
                </label>
                <textarea name="skills" placeholder="e.g. Python, Django, HTML"></textarea>
            </div>

            <!-- Company Fields -->
            <div id="companyFields" style="display:none;">
                <div class="section-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Company Details
                </div>

                <label>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Company Name
                </label>
                <input name="company_name" placeholder="Enter company name">

                <label>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6"/>
                        <polyline points="8 6 2 12 8 18"/>
                    </svg>
                    Required Skills
                </label>
                <textarea name="required_skills" placeholder="e.g. React, Node.js"></textarea>

                <label>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                    Qualification Required
                </label>
                <input name="qualification_required" placeholder="e.g. B.Tech, MBA">
            </div>

            <button type="submit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <line x1="19" y1="8" x2="19" y2="14"/>
                    <line x1="22" y1="11" x2="16" y2="11"/>
                </svg>
                Register
            </button>
        </form>

        <div class="divider">
            <hr/>
            <span>OR</span>
            <hr/>
        </div>

        <p class="center">
            Already have an account?
            <a href="/">Login here</a>
        </p>

    </div>
</div>

<script>
function showFields() {
    var role = document.getElementById("roleSelect").value;
    document.getElementById("studentFields").style.display = (role === "student") ? "block" : "none";
    document.getElementById("companyFields").style.display = (role === "company") ? "block" : "none";
}
</script>

{% endblock %}
